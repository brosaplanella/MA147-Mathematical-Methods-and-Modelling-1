project:
  type: book
  output-dir: docs
  preview:
    watch-inputs: true  # re-render inputs when they change

execute:
  freeze: auto
  cache: true

book:
  title: "MA147 Mathematical Methods and Modelling 1"
  author: "Ferran Brosa Planella"
  date: today
  date-format: "D MMMM, YYYY"
  chapters:
    - index.qmd
    - 1-introduction.qmd
    - 2-differential-equations.qmd
    - 3-difference-equations.qmd
    - 4-modelling.qmd
    - 5-dimensional-analysis.qmd
    - 6-systems.qmd
  downloads: pdf

format:
  html:
    toc: true
    html-math-method: katex
    css: styles.css
    theme:
      light: flatly
      dark: darkly
  pdf:
    documentclass: scrbook
    papersize: a4
    toc: true
    toc-depth: 3
    pdf-engine: pdflatex
    colorlinks: true
    linkcolor: blue
    toccolor: blue

bibliography: references.bib